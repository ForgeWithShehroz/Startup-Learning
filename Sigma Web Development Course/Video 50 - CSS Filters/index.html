<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .img_1{
            width: 300px;
            filter: blur(4px) invert(10%) grayscale(10%) brightness(20%) contrast(2%);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img_1" src="image.jpg" alt="">
    </div>
</body>
</html>
