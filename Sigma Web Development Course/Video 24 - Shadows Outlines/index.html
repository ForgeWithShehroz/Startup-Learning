<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 35px;
            box-shadow: 5px 15px 15px 5px #36ca4f;
        }

        .text-element{
            text-shadow: 2px 2px 2px #a561e6;
            outline: 2px solid red;
            border: 2px solid black;
            border-radius: 8px;
            outline-offset: 19px;
        }
    </style>
</head>
<body>
    <div class="box">I am a box</div>
    <p class="text-element">Lorem ipsum dolor sit amet consectetur adipisicing elit. Maxime vel at iste laudantium beatae adipisci, perferendis est odit sequi possimus necessitatibus, libero aliquam nisi consequatur id provident culpa excepturi ullam cum unde natus cumque!</p>
</body>
</html>
