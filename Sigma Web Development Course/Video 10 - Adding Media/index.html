<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Video Audio and Media/Metadata</title>
</head>
<body>
	<video src="video.mp4" controls muted loop poster="image.png" height="400" width="500"></video> <!-- autoplay is also used -->

	<audio src="audio.mp3" controls autoplay loop muted ></audio> <!-- preload keyword is also used and most important --> 

	<svg height="100" width="100">
		<circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" file="red" />
	</svg>  <!-- We can also use the svg files externally using img tag -->

	<img src="img.svg" alt="My Svg Image">

	<iframe src="https://www.codewithharry.com" height="600" width="1300"></iframe>  <!-- iframe is used to embedd website, youtube video etc. -->
</body>
</html>
