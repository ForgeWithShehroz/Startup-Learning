<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex - Solution Copied</title>
    <style>
            .container{
                background-color: peru;
                width: 80vw;
                height: 80vh;
                position: relative;
            }

            .ball{
                width: 121px;
                height: 121px;
                position: absolute;
                border-radius: 50%;
                bottom: 0;
                left: 0;
                background-color: rgb(134, 89, 89);
                /* animation: animateX 4s; */
                animation: animateX 3s linear infinite, animateY 1s ease-out infinite alternate ;
            }

            @keyframes animateX {
                from{
                    left: 0;
                }
                to{
                    left: 100%;
                }
            }
            @keyframes animateY {
                from{
                    bottom: 0;
                }
                to{
                    bottom: 100%;
                }
            }

    </style>
</head>
<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>
</html>
