<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex - Make a Bouncing Ball</title>
    <style>
        .container {
            background-color: blue;
            width: 70vw;
            height: 70vh;
            position: relative;
        }

        .ball {
            width: 5em;
            height: 5em;
            border-radius: 50%;
            position: absolute;
            left: 0;
            bottom: 0;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: bounce 10s cubic-bezier(0, 0, 0, -0.01) forwards;
        }



        @keyframes bounce {
            0% {

                background-color: red;
                
            }

            25%{
                transform: translate(10em, -15em);
                background-color: rgb(255, 217, 0);
                
            }
            
            50%{
                transform: translate(30em, 0em);
                background-color: rgb(9, 255, 0);

            }
            70%{
                transform: translate(45em, -15em);
                background-color: rgb(0, 238, 255);

            }
            100%{
                transform: translate(64.4vw, 0em);
                background-color: rgb(204, 0, 255);

            }
            
        }
        
      
    </style>

</head>

<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>

</html>
