<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Images</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<img src="image.jpg" alt="Excercise" height="250">

	<table>
		<caption>Employee details</caption>
		<thead>
			<tr>
			<th>Name</th>
			<th>Designation</th>
			<th>Fav Language</th>
		</tr>
		</thead>
		<tbody>
			<tr>
			<td>Shehroz</td>
			<td>Programmer</td>
			<td rowspan="2">JavaScript</td>
		</tr>
		</tbody>
		
		
		<tfoot>
			<tr>
				<td colspan="2">Shehroz</td> 
			</tr>
		</tfoot>
	</table>

	<!-- Lists -->

	<ul type="square">  <!-- Changes the bullets to squares using type="square" -->
		<li>Shehroz</li>
		<li>17</li>
		<li>Programmer</li>
	</ul>
	<ol type="i"> <!-- type="A" for uppercase and type="i" for lowercase roman and further apart -->
		<li>Kamal</li>
		<li>17</li>
		<li>Programmer</li>
	</ol>

	<dl>
		<dt>HTML</dt>
		<dd>HTML stands for hyper text markup language.</dd>

		<dt>CSS</dt>
		<dl>CSS stands for cascading style sheet and is used to beautify the pages.</dl>
	</dl>
</body>
</html>
