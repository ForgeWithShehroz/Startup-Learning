<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Boxmodel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            background-color: aqua;
        }

        .box1 {
            color: yellow;
            margin: 35px;
            padding: 10px;
            border:4px solid blue;
            height: 200px;
            box-sizing: border-box;
        }

        .box2 {
            color: red; 
            margin: 25px;
            padding: 10px;
            border:4px solid black;
            height: 200px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box box1">I am a div.</div>
    <div class="box box2">I am another div.</div>
</body>

</html>
