<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Colors</title>
	<style>
		h1{
			color: red;
		}
		#li1{
			color: red;
		}
		#li2{
			color: #FAB072;
		}
		#li3{
			color: rgb(34, 233, 252);  /* in between 0, 255 */
		}
		#li4{
			color: rgba(34, 23, 252, 0.234); /* red green blue alpha */
		}
		#li5{
			color: hsl(0, 100%, 50%, 1.0);  /* Hue Saturation lightness */
		}
	</style>
</head>
<body>
	<h1>Lets learn about colors</h1>
	<p>
		<ol>
			<li id="li1">Colors keywords</li>
			<li id="li2">HEX Color Code</li>
			<li id="li3">RGB</li>
			<li id="li4">RGBA</li>
			<li id="li5">HSL</li>
		</ol>
	</p>
</body>
</html>
