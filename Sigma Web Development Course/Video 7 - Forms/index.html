<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it</title>
</head>

<body>
    <h1>Forms to apply for Sigma Web Development - TA</h1>
    <form action="post">
        <div><label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username!" required>  <!-- required keyword -->
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name!" autofocus>  <!-- autofocus keyword is used when we want to focus on the input place after any reload or after just getting sumbittinh-->
        </div>

        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Female</label>
        </div>

        <div>
            <input type="checkbox" name="subscribe" id="subscribe">
            <label for="subscribe">Subscribe to newletter</label>
        </div>

        <div>
            <label for="comment">Enter your comment!</label>
            <br>
            <textarea name="comment" id="comment">Enter your comment here!</textarea>
        </div>

        <div>
            <select name="fruits" id="fruits">
                <option value="apple">Apple</option>
                <option value="banana">Banana</option>
                <option value="mango">Mango</option>
            </select>
        </div>
    </form>
</body>

</html>
