<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid blue;
            /* display: inline;  */ /* This will not work to the margin(top) padding(top) and width etc */
            display: inline-block; 
            margin: 35px;
            padding: 45px;
            width: 100px;
        }

        .box1{
            /* display: none; */
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <div class="box box1">also a nice box</div>
    <span>I am a good</span>
    <span>boy</span>
</body>
</html>
