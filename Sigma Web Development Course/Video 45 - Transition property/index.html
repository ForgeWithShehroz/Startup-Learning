<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition Property</title>
    <style>
        .container {
            width: 50vw;
            height: 40vh;
            background-color: rgb(211, 27, 119);

        }

        .box {
            width: 5vw;
            height: 4vh;
            background-color: rgb(20, 166, 224);
            transition-property: transform background-color;
            transition-duration: 3s;
            transition-timing-function: ease-in-out;
            transition-delay: 1s;

        }


        
        .translate {
            transform: translateX(10vw) translateY(10vh);
            background-color: rgb(4, 0, 255);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box translate"></div>
    </div>
</body>

</html>
