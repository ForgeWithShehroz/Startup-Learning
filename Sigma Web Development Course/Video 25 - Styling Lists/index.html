<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Lists</title>
    <style>
        nav ul li {
            list-style: disc;
            /* list-style-type: "emoji"; */
            /* list-style-position: inside; */
            /* list-style-image: url("image.png"); */  
            /* shorthand for given three */
            list-style: disc inside;  /* or */
            /* list-style: inside url("image.png"); */

            background-color: rgb(196, 122, 122);
            border: 2px solid black;

        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Contact Us</li>
            <li>About Us</li>

        </ul>
    </nav>
</body>

</html>
