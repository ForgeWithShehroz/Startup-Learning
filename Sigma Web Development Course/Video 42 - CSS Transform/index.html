<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
    <style>
        .container {
            width: 100vw;
            height: 80vh;
            border: 2px solid purple;
        }

        .box {
            width: 55px;
            height: 55px;
            border: 2px solid black;
            background-attachment: beige;
            /* transform: rotate(40deg); */

            /* transform: rotate(0.25turn); /* Where turn is defined as the 0.25turn == 90deg */  
            /* transform: rotateX(40deg);
            transform: rotate(45deg);
            transform: rotateZ(34deg); */

            /* transform: scale(1.2); */
            /* transform: skew(12deg); */

            transform: translate(77px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
</body>

</html>
