<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }


        .box {
            border: 2px solid black;
            width: 80vw;
            height: 433px;
            padding: 3px;
            margin: 3px;
        }

        .box1 {
            background-color: aqua;
            /* color: white;
            position: sticky;
            top: 0;
            margin: 0;
            padding: 0;
            height: 111px;
            width: 100%; */

            /* text-align: center; */

            position: absolute;
            top: 0px;
            left: 0px;

            /* and also notice this */

            /* position: relative;
            top: 34px;
            left: 56px; */

        }

        .box2 {
            background-color: rgb(145, 44, 175);
            color: white;
            /* text-align: center; */

            /* position: relative;
            z-index: 1; */
        }

        .box3 {
            background-color: rgb(99, 28, 87);
            color: white;
            /* text-align: center; */
            /* 
            position: fixed;
            bottom: 0px;
            left: 8vw;
            height: 111px; */

            /* top: 4px; */
        }

        .box4 {
            background-color: rgb(235, 206, 43);
            color: white;
            /* text-align: center; */

        }

        .parent {
            /* Exception: transform, filter or perspective can also make an element appear as postioned  */
            padding: 35px;
            margin: 45px;
            border: 3px solid gold;           
            /* position: relative; */
            /* or(etc.) */
            /* position: absolute; */

            /* These three properties we'll learn next  */
            /* transform: translate(0); */
            /* filter: invert(); */ 
            /* perspective: 0em; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1">Box1</div>
        <div class="box box2">Box2</div>
        <div class="box box3">Box3</div>
        <div class="box box4">Box4</div>
    </div>
</body>

</html>
