<!DOCTYPE html>

<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}{% endblock %}</title>

<style>

/* BODY */

body{
font-family: Arial, Helvetica, sans-serif;
background:#f4f6f9;
margin:0;
}

/* NAVBAR */

.navbar{
background:#222;
color:white;
padding:15px;
}

.navbar a{
color:white;
text-decoration:none;
font-weight:bold;
margin-right:15px;
}

.nav-right{
float:right;
}

/* FORM BOX */

.form-box{
width:420px;
margin:80px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* INPUT */

input, textarea{
width:95%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
border-radius:5px;
border:1px solid #ccc;
}

/* BUTTON */

button{
padding:8px 16px;
border:none;
border-radius:5px;
background:#2196f3;
color:white;
cursor:pointer;
}

button:hover{
background:#0b7dda;
}

/* TABLE */

table{
width:80%;
margin:40px auto;
border-collapse:collapse;
background:white;
}

th{
background:#333;
color:white;
}

td,th{
padding:10px;
border:1px solid #ddd;
}

tr:nth-child(even){
background:#f2f2f2;
}

/* IMAGE */

img{
border-radius:5px;
}

/* MESSAGE */

.messages{
color:red;
text-align:center;
}

/* Page CSS */

{% block CSS %}{% endblock %}

</style>

</head>

<body>

<div class="navbar">

<a href="{% url 'vege:recepies' %}">Recipes</a>

<div class="nav-right">

{% if request.user.is_authenticated %}

<a href="{% url 'vege:logout' %}">
<button>Logout</button>
</a>

{% else %}

<a href="{% url 'vege:login' %}">
<button>Login</button>
</a>

{% endif %}

</div>

</div>

{% block body %}{% endblock %}
{% block footer %}{% endblock %}

</body>
</html>
